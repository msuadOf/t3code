appId: com.t3tools.t3code.dev
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Settings
    timeout: 60000
- tapOn: Settings
- tapOn: "^Environments(?:,.*)?$"
- tapOn: Add environment
- tapOn: Address
- inputText: ${DAEMON_ADDRESS}
- tapOn: Code
- inputText: ${PAIRING_CODE}
- pressKey: Enter
- extendedWaitUntil:
    notVisible: Code
    timeout: 60000
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: Chats
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "^(Back|Settings)$"
      - tapOn: Close settings
- extendedWaitUntil:
    visible: "(?s).*Native stream smoke.*"
    timeout: 60000
- tapOn: "(?s).*Native stream smoke.*"
- extendedWaitUntil:
    visible: "(?s).*Running.*Read-only.*"
    timeout: 30000
- tapOn: "(?s).*Running.*Read-only.*"
- extendedWaitUntil:
    visible: "(?s).*Read-only native terminal view.*"
    timeout: 30000
- extendedWaitUntil:
    visible: "(?s).*Native output source:.*"
    timeout: 30000
- tapOn: "(?s).*Native output source:.*"
- extendedWaitUntil:
    visible: "(?s).*NATIVE_CLAUDE_READY.*"
    timeout: 30000
- assertNotVisible: "(?s).*NATIVE_CLAUDE_LATENCY_1.*"
- runScript:
    file: claude-release.js
    env:
      STAGE: "1"
- extendedWaitUntil:
    visible: "(?s).*NATIVE_CLAUDE_LATENCY_1.*"
    timeout: 2000
- takeScreenshot: artifacts/native-session/claude-live-sample-1
- runScript:
    file: claude-visible.js
    env:
      STAGE: "1"
- assertNotVisible: "(?s).*NATIVE_CLAUDE_DONE.*"
- assertNotVisible: "(?s).*NATIVE_CLAUDE_LATENCY_2.*"
- runScript:
    file: claude-release.js
    env:
      STAGE: "2"
- extendedWaitUntil:
    visible: "(?s).*NATIVE_CLAUDE_LATENCY_2.*"
    timeout: 2000
- takeScreenshot: artifacts/native-session/claude-live-sample-2
- runScript:
    file: claude-visible.js
    env:
      STAGE: "2"
- assertNotVisible: "(?s).*NATIVE_CLAUDE_DONE.*"
- assertNotVisible: "(?s).*NATIVE_CLAUDE_LATENCY_3.*"
- runScript:
    file: claude-release.js
    env:
      STAGE: "3"
- extendedWaitUntil:
    visible: "(?s).*NATIVE_CLAUDE_LATENCY_3.*"
    timeout: 2000
- takeScreenshot: artifacts/native-session/claude-live-sample-3
- runScript:
    file: claude-visible.js
    env:
      STAGE: "3"
- assertNotVisible: "(?s).*NATIVE_CLAUDE_DONE.*"
- runScript: complete.js
- extendedWaitUntil:
    visible: "(?s).*NATIVE_CLAUDE_DONE.*"
    timeout: 30000
- takeScreenshot: artifacts/native-session/claude-completed
