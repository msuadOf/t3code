appId: com.t3tools.t3code.dev
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          clearState: true
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: Settings
          timeout: 60000
      - tapOn: Settings
      - tapOn: "^Environments(?:,.*)?$"
- extendedWaitUntil:
    visible: Add environment
    timeout: 60000
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            notVisible: "^Address$"
          commands:
            - tapOn:
                text: "^Add environment$"
                retryTapIfNoChange: true
      - extendedWaitUntil:
          visible: "^Address$"
          timeout: 15000
- tapOn: Address
- runFlow:
    when:
      platform: Android
    commands:
      - inputText: ${DAEMON_ADDRESS}
- runFlow:
    when:
      platform: iOS
    commands:
      - longPressOn: "^Address$"
      - tapOn: "^Paste$"
      - hideKeyboard
      - assertVisible: "^${DAEMON_ADDRESS}/#token=${PAIRING_CODE}$"
      - tapOn:
          point: "90%,10%"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "^Code$"
      - inputText: ${PAIRING_CODE}
      - pressKey: Enter
- extendedWaitUntil:
    notVisible: Code
    timeout: 60000
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: Chats
- extendedWaitUntil:
    visible: "(?s).*Native stream smoke.*"
    timeout: 60000
- tapOn: "(?s).*Native stream smoke.*"
- runScript: claude-start.js
- extendedWaitUntil:
    visible: "(?s)^(Running (Read-only|Bash|Native|python3)( .*)?|Bash)$"
    timeout: 30000
- tapOn: "(?s)^(Running (Read-only|Bash|Native|python3)( .*)?|Bash)$"
- extendedWaitUntil:
    visible: "(?s).*Read-only native terminal view.*"
    timeout: 30000
- extendedWaitUntil:
    visible: "(?s)^Native output source:.*"
    timeout: 30000
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            notVisible: "(?s).*NATIVE_CLAUDE_READY.*"
          commands:
            - tapOn: "(?s)^Native output source:.*"
      - extendedWaitUntil:
          visible: "(?s).*NATIVE_CLAUDE_READY.*"
          timeout: 30000
- runFlow:
    when:
      platform: iOS
    commands:
      - scrollUntilVisible:
          element: "(?s).*NATIVE_CLAUDE_READY.*"
          direction: DOWN
          centerElement: true
          visibilityPercentage: 100
          timeout: 30000
- takeScreenshot: artifacts/native-session/claude-ready-for-pixel-measurement
