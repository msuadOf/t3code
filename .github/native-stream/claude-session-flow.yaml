appId: com.t3tools.t3code.dev
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Settings
    timeout: 60000
- tapOn: Settings
- tapOn: "^Environments(?:,.*)?$"
- tapOn: Add environment
- tapOn: Address
- inputText: ${DAEMON_ADDRESS}
- tapOn: Code
- inputText: ${PAIRING_CODE}
- pressKey: Enter
- extendedWaitUntil:
    notVisible: Code
    timeout: 60000
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: Chats
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "^(Back|Settings)$"
      - tapOn: Close settings
- extendedWaitUntil:
    visible: "(?s).*Native stream smoke.*"
    timeout: 60000
- tapOn: "(?s).*Native stream smoke.*"
- runScript: claude-start.js
- extendedWaitUntil:
    visible: "(?s)^(Running.*Read-only.*|Running.*Bash.*|Bash)$"
    timeout: 30000
- tapOn: "(?s)^(Running.*Read-only.*|Running.*Bash.*|Bash)$"
- extendedWaitUntil:
    visible: "(?s).*Read-only native terminal view.*"
    timeout: 30000
- extendedWaitUntil:
    visible: "(?s).*Native output source:.*"
    timeout: 30000
- tapOn: "(?s).*Native output source:.*"
- extendedWaitUntil:
    visible: "(?s).*NATIVE_CLAUDE_READY.*"
    timeout: 30000
- takeScreenshot: artifacts/native-session/claude-ready-for-pixel-measurement
