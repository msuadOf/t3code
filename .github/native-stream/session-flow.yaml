appId: com.t3tools.t3code.dev
---
- launchApp:
    clearState: true
- tapOn: Settings
- tapOn: "^Environments(?:,.*)?$"
- tapOn: Add environment
- tapOn: Address
- inputText: ${DAEMON_ADDRESS}
- tapOn: Code
- inputText: ${PAIRING_CODE}
- pressKey: Enter
- extendedWaitUntil:
    notVisible: Code
    timeout: 60000
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: Chats
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Settings
      - tapOn: Close settings
- extendedWaitUntil:
    visible: "(?s).*Native stream smoke.*"
    timeout: 60000
- tapOn: "(?s).*Native stream smoke.*"
- assertVisible: Thinking
- runScript: advance.js
- extendedWaitUntil:
    visible: "(?s).*NATIVE_TOKEN_06.*"
    timeout: 30000
- takeScreenshot: artifacts/native-session/first-live-delta
- extendedWaitUntil:
    visible: "(?s).*NATIVE_TOKEN_24.*"
    timeout: 30000
- takeScreenshot: artifacts/native-session/suffix-live
- runScript: complete.js
- extendedWaitUntil:
    notVisible: Showing the latest text. Earlier text will appear when available.
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "(?s).*NATIVE_TOKEN_01.*"
    direction: UP
    timeout: 30000
- takeScreenshot: artifacts/native-session/completed-prefix-recovered
