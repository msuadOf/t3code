appId: com.t3tools.t3code.dev
---
- extendedWaitUntil:
    visible: "(?s).*(python3|native-progress).*"
    timeout: 30000
- tapOn: "(?s).*(python3|native-progress).*"
- extendedWaitUntil:
    visible: "(?s).*NATIVE_TOOL_01.*"
    timeout: 30000
- assertNotVisible: "(?s).*NATIVE_TOOL_02.*"
- takeScreenshot: artifacts/native-session/tool-first-output
- runScript: advance.js
- extendedWaitUntil:
    visible: "(?s).*NATIVE_TOOL_02.*"
    timeout: 30000
- assertNotVisible: "(?s).*NATIVE_TOOL_03.*"
- takeScreenshot: artifacts/native-session/tool-live-progress
- runScript: complete.js
- extendedWaitUntil:
    visible: "(?s).*NATIVE_TOOL_DONE.*"
    timeout: 30000
- takeScreenshot: artifacts/native-session/tool-completed
