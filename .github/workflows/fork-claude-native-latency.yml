name: Fork Claude Native Latency

on:
  push:
    branches: [codex/claude-native-trace-source]
    paths:
      - .github/workflows/fork-claude-native-latency.yml
      - .github/native-stream/claude*
      - .github/native-stream/android-screencap.py
      - .github/native-stream/test_android_screencap.py
      - apps/server/src/provider/NativeClaude*
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform to accept
        type: choice
        options: [all, android, ios]
        default: all
      iosShellRevision:
        description: Optional full SHA of a compatible cached iOS shell (strict JS-only allowlist)
        type: string
        default: ""
      iosRunner:
        description: Standard ARM runner for iOS acceptance
        type: choice
        options: [macos-15, macos-26]
        default: macos-15

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: claude-native-latency-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: false

env:
  APP_VARIANT: development
  T3CODE_MOBILE_UPDATES_ENABLED: "0"
  CI: "1"
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  native:
    name: Native session / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'ios' && '[{"platform":"ios","runner":"macos-15"}]' || inputs.platform == 'android' && '[{"platform":"android","runner":"ubuntu-24.04"}]' || '[{"platform":"android","runner":"ubuntu-24.04"},{"platform":"ios","runner":"macos-15"}]') }}
    runs-on: ${{ matrix.platform == 'ios' && (inputs.iosRunner || matrix.runner) || matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Select Xcode 26
        if: matrix.platform == 'ios'
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer

      - name: Free Android build disk
        if: matrix.platform == 'android'
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...
              - --filter=@t3tools/scripts...
              - --filter=t3...

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          echo "$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install pinned Maestro
        env:
          MAESTRO_VERSION: cli-2.12.0
        run: |
          curl -fsSL "https://github.com/mobile-dev-inc/Maestro/releases/download/$MAESTRO_VERSION/maestro.zip" -o "$RUNNER_TEMP/maestro.zip"
          echo 'a6044a84542f522f434c5dc3d609e60c7446d423f3ed1b2ae513f5c48663ec5e  maestro.zip' > "$RUNNER_TEMP/maestro.sha256"
          (cd "$RUNNER_TEMP" && shasum -a 256 -c maestro.sha256)
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"

      - name: Verify raw screenshot decoder
        run: |
          python3 .github/native-stream/test_android_screencap.py
          python3 .github/native-stream/test_claude_video_latency.py
          python3 .github/native-stream/test_claude_checkpoint.py

      - name: Prepare screenshot recognition
        run: |
          if [ "${{ matrix.platform }}" = android ]; then
            sudo apt-get update -qq
            sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
          else
            if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
            swiftc -O .github/native-stream/claude-screen-ocr.swift -o "$RUNNER_TEMP/claude-screen-ocr"
            echo "CLAUDE_SCREEN_OCR=$RUNNER_TEMP/claude-screen-ocr" >> "$GITHUB_ENV"
          fi

      - name: Verify independent H264 prefix decoding
        if: matrix.platform == 'ios'
        run: |
          command -v ffmpeg
          command -v ffprobe
          python3 .github/native-stream/test_claude_h264_prefix.py

      - name: Prepare evidence directory
        run: mkdir -p artifacts/native-session

      - name: Install stock Claude fixture binary
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$NATIVE_PLATFORM" = ios ]; then package='@anthropic-ai/claude-code-darwin-arm64'; else package='@anthropic-ai/claude-code-linux-x64'; fi
          mkdir -p "$RUNNER_TEMP/claude-native"
          npm pack "$package@2.1.314" --pack-destination "$RUNNER_TEMP/claude-native" > "$RUNNER_TEMP/claude-pack-name"
          tar -xzf "$RUNNER_TEMP/claude-native/$(tail -n 1 "$RUNNER_TEMP/claude-pack-name")" -C "$RUNNER_TEMP/claude-native"
          echo "CLAUDE_BINARY=$RUNNER_TEMP/claude-native/package/claude" >> "$GITHUB_ENV"

      - name: Identify native app sources
        id: native-source
        run: |
          git rev-parse HEAD:apps/mobile HEAD:packages HEAD:scripts HEAD:assets HEAD:pnpm-lock.yaml HEAD:package.json HEAD:pnpm-workspace.yaml HEAD:third-party-licenses.config.json > "$RUNNER_TEMP/native-source-hashes"
          echo "$APP_VARIANT:$T3CODE_MOBILE_UPDATES_ENABLED" >> "$RUNNER_TEMP/native-source-hashes"
          echo "digest=$(shasum -a 256 "$RUNNER_TEMP/native-source-hashes" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore compiled native app
        id: native-app
        uses: actions/cache/restore@v4
        with:
          key: native-session-app-${{ matrix.platform == 'ios' && 'v2' || 'v1' }}-${{ matrix.platform }}-${{ steps.native-source.outputs.digest }}
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            ${{ runner.temp }}/native-stream-ios/Build/Products/Release-iphonesimulator/T3CodeDev.app

      - name: Check optional iOS shell compatibility
        id: ios-shell-source
        if: github.event_name == 'workflow_dispatch' && matrix.platform == 'ios' && steps.native-app.outputs.cache-hit != 'true' && inputs.iosShellRevision != ''
        env:
          IOS_SHELL_REVISION: ${{ inputs.iosShellRevision }}
        run: python3 .github/native-stream/claude-ios-shell.py prepare --revision "$IOS_SHELL_REVISION" --report artifacts/native-session/ios-shell-reuse.json

      - name: Restore compatible iOS shell
        id: ios-shell
        if: steps.ios-shell-source.outputs.eligible == 'true'
        uses: actions/cache/restore@v4
        with:
          key: native-session-app-v2-ios-${{ steps.ios-shell-source.outputs.digest }}
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            ${{ runner.temp }}/native-stream-ios/Build/Products/Release-iphonesimulator/T3CodeDev.app

      - name: Embed current JS and assets in cached iOS shell
        id: ios-rebundle
        if: steps.ios-shell.outputs.cache-hit == 'true'
        run: python3 .github/native-stream/claude-ios-shell.py rebundle --app "$RUNNER_TEMP/native-stream-ios/Build/Products/Release-iphonesimulator/T3CodeDev.app" --report artifacts/native-session/ios-shell-reuse.json

      - name: Generate native project
        if: steps.native-app.outputs.cache-hit != 'true' && steps.ios-rebundle.outputs.reused != 'true'
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --clean --platform ${{ matrix.platform }} 2>&1 | tee ../../artifacts/native-session/prebuild.log

      - uses: gradle/actions/setup-gradle@v5
        if: matrix.platform == 'android'

      - name: Build Android fixture APK
        if: matrix.platform == 'android' && steps.native-app.outputs.cache-hit != 'true'
        working-directory: apps/mobile/android
        run: ./gradlew app:assembleRelease -PreactNativeArchitectures=x86_64 --max-workers=2 2>&1 | tee ../../../artifacts/native-session/build.log

      - name: Build iOS fixture app
        if: matrix.platform == 'ios' && steps.native-app.outputs.cache-hit != 'true' && steps.ios-rebundle.outputs.reused != 'true'
        working-directory: apps/mobile
        run: |
          xcodebuild -workspace ios/T3CodeDev.xcworkspace -scheme T3CodeDev -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/native-stream-ios" CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build > ../../artifacts/native-session/build.log 2>&1

      - name: Save compiled native app before UI checks
        if: steps.native-app.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: native-session-app-${{ matrix.platform == 'ios' && 'v2' || 'v1' }}-${{ matrix.platform }}-${{ steps.native-source.outputs.digest }}
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            ${{ runner.temp }}/native-stream-ios/Build/Products/Release-iphonesimulator/T3CodeDev.app

      - name: Archive iOS simulator app for independent acceptance
        if: matrix.platform == 'ios'
        run: tar -czf "$RUNNER_TEMP/claude-native-ios-app.tgz" -C "$RUNNER_TEMP/native-stream-ios/Build/Products/Release-iphonesimulator" T3CodeDev.app

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'ios'
        with:
          name: claude-native-ios-app
          path: ${{ runner.temp }}/claude-native-ios-app.tgz
          retention-days: 3
          compression-level: 0

      - name: Prepare iOS simulator and install app
        if: matrix.platform == 'ios'
        timeout-minutes: 15
        run: |
          app_path="$RUNNER_TEMP/native-stream-ios/Build/Products/Release-iphonesimulator/T3CodeDev.app"
          python3 .github/native-stream/claude-run-bounded.py 60 verify-signature codesign --verify --deep --strict --verbose=2 "$app_path"
          python3 .github/native-stream/claude-run-bounded.py 60 inspect-entitlements codesign --display --entitlements :- "$app_path" > artifacts/native-session/simulator-entitlements.plist
          for attempt in 1 2; do
            if python3 .github/native-stream/claude-run-bounded.py 60 "list-device-types-attempt-$attempt" xcrun simctl list devicetypes --json > "$RUNNER_TEMP/latency-device-types.json"; then
              break
            fi
            if [ "$attempt" = 2 ]; then exit 1; fi
            sleep 2
          done
          python3 .github/native-stream/claude-run-bounded.py 60 list-runtimes xcrun simctl list runtimes --json > "$RUNNER_TEMP/latency-runtimes.json"
          sdk_version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          node --input-type=module - "$RUNNER_TEMP/latency-device-types.json" "$RUNNER_TEMP/latency-runtimes.json" "$sdk_version" <<'JSDEVICE' > "$RUNNER_TEMP/latency-device-selection.json"
          import fs from "node:fs";
          const types = JSON.parse(fs.readFileSync(process.argv[2], "utf8")).devicetypes;
          const runtimes = JSON.parse(fs.readFileSync(process.argv[3], "utf8")).runtimes;
          const sdkVersion = process.argv[4].trim();
          const sdkMajorMinor = sdkVersion.split(".").slice(0, 2).join(".");
          const device = types.find(d => d.identifier === "com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation");
          const runtime = runtimes.filter(r => r.isAvailable && r.name.startsWith("iOS ") && r.version.split(".").slice(0, 2).join(".") === sdkMajorMinor).sort((a, b) => b.version.localeCompare(a.version, undefined, {numeric: true}))[0];
          if (!device || !runtime) throw new Error(`iPhone SE (3rd generation) and an available iOS runtime matching simulator SDK ${sdkMajorMinor} are required`);
          console.log(JSON.stringify({deviceType: device.identifier, deviceName: device.name, runtime: runtime.identifier, runtimeVersion: runtime.version, sdkVersion}));
          JSDEVICE
          device_type="$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/latency-device-selection.json','utf8')).deviceType")"
          runtime="$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/latency-device-selection.json','utf8')).runtime")"
          device_id="$(python3 .github/native-stream/claude-run-bounded.py 60 create-device xcrun simctl create 'T3 latency iPhone SE' "$device_type" "$runtime")"
          cp "$RUNNER_TEMP/latency-device-selection.json" artifacts/native-session/ios-device-selection.json
          echo "$device_id" > artifacts/native-session/ios-device-id.txt
          echo "IOS_LATENCY_DEVICE=$device_id" >> "$GITHUB_ENV"
          python3 .github/native-stream/claude-run-bounded.py 60 boot xcrun simctl boot "$device_id"
          python3 .github/native-stream/claude-run-bounded.py 300 boot-ready xcrun simctl bootstatus "$device_id" -b
          python3 .github/native-stream/claude-run-bounded.py 180 install-app xcrun simctl install "$device_id" "$app_path"

      - name: Start isolated native session and T3 daemon
        run: |
          python3 .github/native-stream/claude-fixture.py > "$RUNNER_TEMP/native-session-ready.jsonl" 2> artifacts/native-session/fixture.log &
          echo "$!" > "$RUNNER_TEMP/native-session-fixture.pid"
          python3 - <<'PY'
          import json, os, pathlib, time
          ready = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-session-ready.jsonl'
          fixture_pid = int((ready.parent / 'native-session-fixture.pid').read_text())
          for attempt in range(1800):
              if ready.exists() and ready.read_text().strip():
                  metadata = json.loads(ready.read_text().splitlines()[0])
                  pairing = json.load(open(metadata['pairingPath']))
                  with open(os.environ['GITHUB_ENV'], 'a') as output:
                      for key, value in {'DAEMON_ADDRESS': pairing['host'], 'PAIRING_CODE': pairing['code'], 'CONTROL_URL': metadata['controlUrl'], 'T3_PORT': str(metadata['t3Port'])}.items():
                          output.write(key + '=' + value + '\n')
                  print('::add-mask::' + pairing['code'])
                  break
              try:
                  os.kill(fixture_pid, 0)
              except ProcessLookupError:
                  log = pathlib.Path('artifacts/native-session/fixture.log').read_text()
                  raise RuntimeError('Native session fixture exited before readiness:\n' + log[-8000:])
              time.sleep(.1)
          else:
              raise RuntimeError('Native session fixture failed to start')
          PY

      - name: Enable KVM
        if: matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test Android native renderer
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          disable-animations: false
          script: |
            adb shell wm size 540x1170
            adb shell wm density 210
            adb shell wm size > artifacts/native-session/android-display-size.txt
            adb shell wm density > artifacts/native-session/android-display-density.txt
            adb install apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            adb reverse "tcp:$T3_PORT" "tcp:$T3_PORT"
            maestro test -e DAEMON_ADDRESS="$DAEMON_ADDRESS" -e PAIRING_CODE="$PAIRING_CODE" -e CONTROL_URL="$CONTROL_URL" --format junit --output artifacts/native-session/results.xml --test-output-dir artifacts/native-session/maestro .github/native-stream/claude-session-flow.yaml
            python3 .github/native-stream/claude-screen-latency.py --platform android

      - name: Test iOS native renderer
        if: matrix.platform == 'ios'
        timeout-minutes: 20
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
        run: |
          device_id="$IOS_LATENCY_DEVICE"
          python3 .github/native-stream/claude-run-bounded.py 180 prelaunch-app xcrun simctl launch "$device_id" com.t3tools.t3code.dev
          for attempt in 1 2 3; do
            if printf '%s/#token=%s' "$DAEMON_ADDRESS" "$PAIRING_CODE" | python3 .github/native-stream/claude-run-bounded.py 60 "copy-pairing-url-attempt-$attempt" xcrun simctl pbcopy "$device_id"; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 2
          done
          python3 .github/native-stream/claude-run-maestro.py maestro --device "$device_id" test -e DAEMON_ADDRESS="$DAEMON_ADDRESS" -e PAIRING_CODE="$PAIRING_CODE" -e CONTROL_URL="$CONTROL_URL" --format junit --output artifacts/native-session/results.xml --test-output-dir artifacts/native-session/maestro .github/native-stream/claude-session-flow.yaml
          python3 .github/native-stream/claude-video-latency.py --device "$device_id"

      - name: Collect iOS crash reports
        if: always() && matrix.platform == 'ios'
        run: |
          python3 - <<'PYCRASH'
          import pathlib, shutil
          reports = pathlib.Path.home() / 'Library/Logs/DiagnosticReports'
          target = pathlib.Path('artifacts/native-session/crashes')
          target.mkdir(parents=True, exist_ok=True)
          for report in reports.glob('*T3CodeDev*.ips'):
              shutil.copy(report, target / report.name)
          PYCRASH

      - name: Stop isolated fixture
        if: always()
        run: |
          if [ -n "${CONTROL_URL:-}" ]; then curl --max-time 5 -fsS "$CONTROL_URL/shutdown" || true; fi
          if [ -f "$RUNNER_TEMP/native-session-fixture.pid" ]; then kill -TERM "$(cat "$RUNNER_TEMP/native-session-fixture.pid")" 2>/dev/null || true; fi
          if [ -f "$RUNNER_TEMP/native-session-ready.jsonl" ]; then
            python3 - <<'PY'
          import json, os, pathlib, shutil, time
          ready = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-session-ready.jsonl'
          if ready.read_text().strip():
              root = pathlib.Path(json.loads(ready.read_text().splitlines()[0])['root'])
              deadline = time.monotonic() + 90
              while not (root / 'final-native-state.json').exists() and time.monotonic() < deadline:
                  time.sleep(.25)
              if not (root / 'final-native-state.json').exists():
                  pathlib.Path('artifacts/native-session/cleanup-incomplete.txt').write_text('Fixture cleanup did not produce final native state within 90 seconds; available evidence was retained.')
              for name in ['t3.log', 'native.log', 'model-events.jsonl', 'final-native-state.json', 'cli-terminal.bin', 'latency.json', 'cleanup-error.txt', 'native-inventory-before-cleanup.json', 'native-output-manifest.json', 'native-evidence-error.txt', 'native-inventory-error.txt']:
                  if (root / name).exists(): shutil.copy(root / name, 'artifacts/native-session/' + name)
              if (root / 'native-evidence').exists(): shutil.copytree(root / 'native-evidence', 'artifacts/native-session/native-evidence', dirs_exist_ok=True)
              if (root / 'native-transcript-evidence').exists(): shutil.copytree(root / 'native-transcript-evidence', 'artifacts/native-session/native-transcript-evidence', dirs_exist_ok=True)
          PY
          fi

      - name: Upload native smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claude-native-latency-${{ matrix.platform }}
          path: artifacts/native-session/
          if-no-files-found: warn
          retention-days: 14

      - name: Explain verification scope
        if: always()
        run: |
          echo '### Stock Claude shared session / 2-second visibility budget / ${{ matrix.platform }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Normal native app entry, real T3 daemon, stock Claude native worker sharing one session, localhost model fixture. Verifies foreground stdout appears on the native renderer within 2000ms of emission, measured by one control-server monotonic clock. The command stays blocked until visibility acknowledgement; no scheduling changes. No account or release.' >> "$GITHUB_STEP_SUMMARY"
